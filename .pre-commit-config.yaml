repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: generated-files-in-sync
        name: Generated skills/prompts in sync
        entry: tools/generate
        args: ["--check"]
        language: script
        pass_filenames: false
        files: ^(\.claude/commands/|\.codex/|\.copilot/|\.antigravity/skills/|prompts/|tools/generate)
        stages: [pre-commit]
      - id: bats-unit-tests
        name: BATS unit tests
        entry: test/run
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
