name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      # Pinned rather than "3.x": pre-commit builds the SkillSpector hook's own
      # venv, and that package requires >=3.12,<3.16. A floating latest would
      # install fine until the day CPython ships a version past that range.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # The mods are function-hook plugins: TypeScript loaded into the Claude Code
  # engine, so neither shellcheck nor BATS can say anything about them. Their
  # own tests run in a child of the claude binary against a mock engine, which
  # needs no credentials and no home directory, so a plain npm install is the
  # whole setup. test/plugin-manifest.bats runs the same command locally and
  # skips where claude is absent; this job is what actually gates a PR.
  mods:
    name: Function-hook mod tests
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run each mod's tests
        run: |
          for mod in mods/*/; do
            echo "== $mod"
            claude plugin test "$mod"
          done

  # The scripts here are Bash, but they run under Git Bash on Windows too, and
  # bin/review-gate in particular has to cope with the `C:\...` paths and the
  # separate PowerShell tool a Windows harness hands it. Only the test suite
  # runs here; shellcheck and markdownlint are platform-independent and already
  # covered above.
  #
  # Process creation under Git Bash is slow enough that the suite takes about
  # nine minutes in one job against one on Linux, so it is split by file. The
  # three slowest files are named in SLOW and get shards of their own; the
  # "rest" shard runs every file SLOW does not name, so a new test file lands
  # there without anyone listing it.
  test-windows:
    name: BATS on Windows (${{ matrix.shard.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: review-gate, match: "review-gate" }
          - { name: review-loops, match: "code-review-loop|lib-review-loop" }
          - { name: rest, match: "" }
    env:
      SLOW: "review-gate|code-review-loop|lib-review-loop"
      MATCH: ${{ matrix.shard.match }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Give git an identity for the throwaway repos the tests build
        shell: bash
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Run BATS under Git Bash
        shell: bash
        run: |
          if [[ -n "$MATCH" ]]; then
            files=$(ls test/*.bats | grep -E "/($MATCH)\.bats$")
          else
            files=$(ls test/*.bats | grep -vE "/($SLOW)\.bats$")
          fi
          echo "$files"
          # shellcheck disable=SC2086  # one path per word, none with spaces
          test/bats/bats-core/bin/bats $files
